name: Build UZB Simulyator APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
      - name: Lock Android Orientation to Landscape
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml || true
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload UZB-SIMULYATOR.apk
        uses: actions/upload-artifact@v4
        with:
          name: UZB-SIMULYATOR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
